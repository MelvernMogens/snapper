name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

      - name: No networking code
        run: |
          if grep -rn "URLSession\|NWConnection" Sources; then
            echo "::error::Snapper must not contain networking code"; exit 1
          fi

      - name: Fail if a secret got committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.pem$|credentials'; then
            echo "::error::A secret or local database file is tracked in git"
            exit 1
          fi
          echo "no secrets tracked"
